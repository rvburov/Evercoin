<title>Evercoin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Раскладка — как в AI Capper: боковое меню на компьютере, нижние вкладки с кнопкой «+» на телефоне,
   рабочая область из карточек на 12-колоночной сетке. Цвета, шрифты, радиусы и тени — токены AI Capper без изменений.
   Минимализм Evercoin: одна главная сумма на экране, копейки мельче рублей, цвет категории — только метка,
   красный — только для проблем (долг, перерасход), расходы пишутся обычным цветом со знаком минус. */
:root {
  --bg: #f1f4f0;
  --surface: #fcfcfb;
  --surface-2: #eaeee8;
  --surface-3: #dfe5dc;
  --line: #dde2da;
  --line-strong: #c3cabf;
  --fg: #101511;
  --fg-2: #4a524c;
  --fg-3: #737b74;
  --accent: #14684a;
  --accent-hover: #0f553c;
  --accent-fg: #ffffff;
  --accent-soft: #dcede3;
  --accent-ink: #0d4a34;
  --focus: #2a78d6;

  --good: #0ca30c;      --good-ink: #006300;   --good-soft: #dff2dc;
  --warn: #fab219;      --warn-ink: #7a5200;   --warn-soft: #fbefd2;
  --serious: #ec835a;   --serious-ink: #8a3a17;--serious-soft: #fbe4da;
  --bad: #d03b3b;       --bad-ink: #a32424;    --bad-soft: #f8dede;
  --info-ink: #1c5cab;  --info-soft: #dde9f8;

  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;

  --chart-grid: #e3e7e0;
  --chart-axis: #c3cabf;
  --chart-muted: #7d847e;
  --shadow: 0 1px 2px rgba(16,21,17,.06), 0 8px 24px -12px rgba(16,21,17,.18);
  --overlay: rgba(16,21,17,.42);
  --dd-bg: var(--surface); --dd-border: var(--line); --dd-active: var(--surface-2);
  --dd-shadow: 0 2px 6px rgba(16,21,17,.06), 0 18px 40px -12px rgba(16,21,17,.28);
  --shadow-knob: 0 1px 2px rgba(0,0,0,.25);
  --shadow-raised: 0 1px 2px rgba(0,0,0,.12);
  --brand-spark: #e6f05a;  /* блик монеты в знаке Evercoin — тот же цвет, что мяч в знаке AI Capper */
  --on-bad: #ffffff;

  --font-display: "Geologica", "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --fs-xs: .75rem; --fs-sm: .8125rem; --fs-md: .9375rem; --fs-lg: 1.0625rem;
  --fs-xl: 1.375rem; --fs-2xl: 1.75rem; --fs-hero: 2.75rem;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --gutter: 16px;
  --sidebar-w: 260px;
  --topbar-h: 60px;
  --tabbar-h: 76px;
  --tap: 40px;
  --content-max: 1280px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d110f; --surface: #161b18; --surface-2: #1e2420; --surface-3: #272f2a;
    --line: #29312c; --line-strong: #3a443e;
    --fg: #edf1ed; --fg-2: #b8c1ba; --fg-3: #8a938c;
    --accent: #3fbf8a; --accent-hover: #5bd09f; --accent-fg: #05140d; --accent-soft: #17352a; --accent-ink: #7fdcb3;
    --focus: #5fa0ef;
    --good-ink: #4cc54c; --good-soft: #15301a;
    --warn-ink: #f2c25a; --warn-soft: #33290f;
    --serious-ink: #f0a07f; --serious-soft: #3a2218;
    --bad-ink: #f07a7a; --bad-soft: #3a1b1b;
    --info-ink: #8db8f2; --info-soft: #172a45;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --chart-grid: #262d29; --chart-axis: #39433d; --chart-muted: #8a938c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -12px rgba(0,0,0,.6);
    --overlay: rgba(0,0,0,.6);
    --dd-bg: var(--surface-2); --dd-border: var(--line-strong); --dd-active: var(--surface-3);
    --dd-shadow: 0 2px 6px rgba(0,0,0,.4), 0 18px 40px -12px rgba(0,0,0,.75);
    --shadow-knob: 0 1px 2px rgba(0,0,0,.5);
    --shadow-raised: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d110f; --surface: #161b18; --surface-2: #1e2420; --surface-3: #272f2a;
  --line: #29312c; --line-strong: #3a443e;
  --fg: #edf1ed; --fg-2: #b8c1ba; --fg-3: #8a938c;
  --accent: #3fbf8a; --accent-hover: #5bd09f; --accent-fg: #05140d; --accent-soft: #17352a; --accent-ink: #7fdcb3;
  --focus: #5fa0ef;
  --good-ink: #4cc54c; --good-soft: #15301a;
  --warn-ink: #f2c25a; --warn-soft: #33290f;
  --serious-ink: #f0a07f; --serious-soft: #3a2218;
  --bad-ink: #f07a7a; --bad-soft: #3a1b1b;
  --info-ink: #8db8f2; --info-soft: #172a45;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --chart-grid: #262d29; --chart-axis: #39433d; --chart-muted: #8a938c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -12px rgba(0,0,0,.6);
  --overlay: rgba(0,0,0,.6);
  --dd-bg: var(--surface-2); --dd-border: var(--line-strong); --dd-active: var(--surface-3);
  --dd-shadow: 0 2px 6px rgba(0,0,0,.4), 0 18px 40px -12px rgba(0,0,0,.75);
  --shadow-knob: 0 1px 2px rgba(0,0,0,.5);
  --shadow-raised: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}

/* ---------- база ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: var(--fs-md); line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
/* полоса под вырезом экрана телефона — в цвет шапки */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; line-height: 1.2; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: var(--fs-2xl); font-weight: 600; }
h2 { font-size: var(--fs-xl); font-weight: 600; }
h3 { font-size: var(--fs-lg); font-weight: 600; }
h4 { font-size: var(--fs-md); font-weight: 600; }
p { margin: 0; }
a { color: var(--accent-ink); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-3); }
.soft { color: var(--fg-2); }
.small { font-size: var(--fs-sm); }
.xsmall { font-size: var(--fs-xs); }
.eyebrow { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); font-weight: 600; }
.good-text { color: var(--good-ink); }
.bad-text { color: var(--bad-ink); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- сетка ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.col-12 { grid-column: span 12; } .col-8 { grid-column: span 8; } .col-7 { grid-column: span 7; }
.col-6 { grid-column: span 6; } .col-5 { grid-column: span 5; } .col-4 { grid-column: span 4; } .col-3 { grid-column: span 3; }
@media (max-width: 1180px) {
  .col-3 { grid-column: span 6; } .col-4 { grid-column: span 6; }
  .col-8, .col-7, .col-5 { grid-column: span 12; }
}
@media (max-width: 720px) {
  .grid > [class*="col-"] { grid-column: span 12; }
  .grid > .half-mobile { grid-column: span 6; }
  .grid { gap: 12px; }
}
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-width: 0; }
.list { display: flex; flex-direction: column; }
.grow { flex: 1 1 auto; min-width: 0; }
.row.mobile-only-row, .btn.mobile-only { display: none; }
@media (max-width: 960px) { .row.mobile-only-row { display: flex; flex-wrap: nowrap; } .btn.mobile-only { display: inline-flex; } }
/* боковая колонка рядом с col-8: на планшете и телефоне — во всю ширину, а не половиной */
.grid > .col-side { grid-column: span 4; }
@media (max-width: 1180px) { .grid > .col-side { grid-column: span 12; } }

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } }
@keyframes dd-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } }

/* ---------- оболочка ---------- */
.shell { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
.sidebar-col { background: var(--surface); border-right: 1px solid var(--line); min-width: 0; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding: 18px 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; text-decoration: none; color: var(--fg); }
.brand-mark { width: 34px; height: 34px; flex: none; display: block; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.0625rem; letter-spacing: -.01em; line-height: 1.1; }
.brand-sub { font-size: var(--fs-xs); color: var(--fg-3); }
.nav-link {
  display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: var(--r-md); min-height: var(--tap);
  color: var(--fg-2); text-decoration: none; font-weight: 500; font-size: var(--fs-md);
  width: 100%; border: 0; background: none; cursor: pointer; text-align: left; font-family: inherit;
}
.nav-link svg { width: 20px; height: 20px; flex: none; }
.nav-link:hover { background: var(--surface-2); color: var(--fg); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.nav-link.danger { color: var(--bad-ink); }
.sidebar-foot { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; gap: 4px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  min-height: var(--topbar-h); display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-home { display: none; }
.topbar-title { min-width: 0; flex: 1; }
.topbar-title h1 { font-size: var(--fs-xl); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-title .crumbs { font-size: var(--fs-xs); color: var(--fg-3); }
.topbar-title .crumbs a { color: var(--fg-3); text-decoration: none; }
.topbar-title .crumbs a:hover { color: var(--fg); text-decoration: underline; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.total-pill {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: var(--fs-sm); white-space: nowrap; color: var(--fg); text-decoration: none;
}
.total-pill b { font-family: var(--font-mono); font-weight: 500; }
.demo-pill { font-size: var(--fs-xs); padding: 3px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn-ink); font-weight: 600; white-space: nowrap; }
.avatar {
  width: var(--tap); height: var(--tap); border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--accent); color: var(--accent-fg); font-weight: 600; font-family: var(--font-display);
  border: 0; cursor: pointer; text-decoration: none; font-size: var(--fs-md);
}
.avatar.lg { width: 64px; height: 64px; font-size: var(--fs-xl); cursor: default; }

.view {
  width: 100%; max-width: var(--content-max); margin: 0 auto;
  padding-block: 24px 48px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
.view:focus { outline: none; }
.mobile-note { display: none; }
.tabbar { display: none; }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar-col { display: none; }
  .topbar { min-height: 56px; gap: 8px; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
  .topbar-home { display: flex; }
  .topbar-actions { gap: 6px; }
  .topbar-title h1 { font-size: 1.0625rem; }
  .topbar .hide-mobile { display: none !important; }
  .view {
    padding-block: 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom, 0px)); gap: 16px;
    padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  }
  .mobile-note { display: block; align-self: flex-start; }
  .tabbar {
    min-height: var(--tabbar-h); display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px));
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-height: 52px;
    font-size: 11px; font-weight: 500; color: var(--fg-3); text-decoration: none; background: none; border: 0; cursor: pointer; font-family: inherit;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab[aria-current="page"] { color: var(--accent-ink); }
  .tab-primary { position: relative; top: -8px; color: var(--fg-2); }
  .tab-plus { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); box-shadow: var(--shadow); }
  .tab-plus svg { width: 26px; height: 26px; }
  html { scroll-padding-bottom: calc(var(--tabbar-h) + 16px); }
}

/* ---------- карточка и показатель ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; display: flex; flex-direction: column; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 0; flex-wrap: wrap; }
.card-head h3 { font-size: var(--fs-md); }
.card-sub { font-size: var(--fs-sm); color: var(--fg-3); margin-top: 2px; }
.card-body { padding: 14px 18px 18px; min-width: 0; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.card-body.flush { padding: 8px 0 6px; }
.card-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
a.card { color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s; }
a.card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
@media (max-width: 720px) {
  .card-head { padding: 14px 14px 0; }
  .card-body { padding: 12px 14px 14px; }
  .card-foot { padding: 12px 14px; }
}
.stat { display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; min-width: 0; }
.stat-label { font-size: var(--fs-sm); color: var(--fg-2); }
.stat-value { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 600; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 22px; }
.stat-hint { font-size: var(--fs-xs); color: var(--fg-3); }
.delta { font-size: var(--fs-sm); font-weight: 600; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.delta svg { width: 14px; height: 14px; }
.delta.good { color: var(--good-ink); }
.delta.bad { color: var(--bad-ink); }
.delta.flat { color: var(--fg-3); }

/* ---------- метки, кнопки ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--fg-2); border: 1px solid transparent;
}
.chip svg { width: 13px; height: 13px; }
.chip.good { background: var(--good-soft); color: var(--good-ink); }
.chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
.chip.bad { background: var(--bad-soft); color: var(--bad-ink); }
.chip.info { background: var(--info-soft); color: var(--info-ink); }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip.outline { background: transparent; border-color: var(--line-strong); color: var(--fg-2); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
  border-radius: var(--r-md); border: 1px solid transparent; font-weight: 600; font-size: var(--fs-md);
  cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s; font-family: inherit;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.secondary { background: var(--surface); color: var(--fg); border-color: var(--line-strong); }
.btn.secondary:hover { background: var(--surface-2); }
.btn.ghost { background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.danger { background: var(--bad-soft); color: var(--bad-ink); }
.btn.danger:hover { background: color-mix(in srgb, var(--bad-soft) 70%, var(--bad) 30%); }
.btn.sm { height: 32px; padding: 0 12px; font-size: var(--fs-sm); border-radius: var(--r-sm); }
.btn.lg { height: 48px; padding: 0 22px; font-size: var(--fs-lg); }
.btn.block { width: 100%; }
.btn.icon-only { width: 40px; padding: 0; }
.btn.sm.icon-only { width: 32px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
@media (max-width: 960px) {
  .btn.sm { height: var(--tap); }
  .btn.sm.icon-only { width: var(--tap); }
  .segmented button { min-height: var(--tap); }
}

/* ---------- поля ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: var(--fs-sm); font-weight: 500; color: var(--fg-2); display: flex; justify-content: space-between; gap: 8px; }
.field-hint { font-size: var(--fs-xs); color: var(--fg-3); }
.field-error { font-size: var(--fs-xs); color: var(--bad-ink); font-weight: 500; }
.input-wrap { position: relative; display: flex; align-items: center; min-width: 0; }
.input, .textarea, .select {
  width: 100%; min-width: 0; height: 42px; padding: 0 12px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line-strong); color: var(--fg);
}
.textarea { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.55; }
